<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いま なんじですか — 말하기 수행평가</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Jeju+Gothic&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eaf3f9;
    --card-blue: #b8d4ee;
    --card-peach: #f5c9a8;
    --title-bg: #2d2d2d;
    --title-text: #ffffff;
    --pin-default: #5b8fc9;
    --pin-active: #e05a2b;
    --btn-bg: #f5c040;
    --btn-text: #2d2d2d;
    --text-dark: #2d2d2d;
    --divider: #a0b8cc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jeju Gothic', sans-serif;
    background: #deedf5;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }

  /* ── SETUP SCREEN ── */
  #setup-screen {
    background: var(--bg);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  }

  #setup-screen h1 {
    font-family: 'Klee One', serif;
    font-size: 1.7rem;
    font-weight: 600;
    text-align: center;
    color: var(--title-text);
    background: var(--title-bg);
    padding: 14px 24px;
    border-radius: 50px;
    margin-bottom: 32px;
    letter-spacing: 0.08em;
  }

  .setup-section { margin-bottom: 24px; }

  .setup-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: #666;
    margin-bottom: 8px;
    letter-spacing: 0.06em;
  }

  .city-input-area {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: white;
    border-radius: 14px;
    padding: 12px;
    min-height: 56px;
    border: 2px solid var(--card-blue);
  }

  .city-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card-blue);
    color: var(--text-dark);
    font-size: 0.9rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 50px;
    font-family: 'Jeju Gothic', sans-serif;
  }

  .city-tag button {
    background: none;
    border: none;
    cursor: pointer;
    color: #666;
    font-size: 1rem;
    line-height: 1;
    padding: 0;
  }
  .city-tag button:hover { color: #e05a2b; }

  .city-input-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .city-input-row input {
    flex: 1;
    border: 2px solid var(--card-blue);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.95rem;
    font-family: 'Jeju Gothic', sans-serif;
    outline: none;
    background: white;
  }
  .city-input-row input:focus { border-color: var(--pin-default); }

  .city-input-row button {
    background: var(--pin-default);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Jeju Gothic', sans-serif;
    transition: background 0.2s;
  }
  .city-input-row button:hover { background: #3a6fa0; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border-radius: 14px;
    padding: 14px 18px;
    border: 2px solid var(--card-blue);
    margin-bottom: 10px;
  }
  .toggle-row span {
    font-size: 0.95rem;
    color: var(--text-dark);
    font-family: 'Jeju Gothic', sans-serif;
  }

  .toggle {
    position: relative;
    width: 48px;
    height: 26px;
    flex-shrink: 0;
  }
  .toggle input { display: none; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.3s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }
  .toggle input:checked + .toggle-slider { background: var(--pin-default); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(22px); }

  .sub-toggle {
    margin-left: 20px;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.3s;
    border-color: #ddd !important;
  }
  .sub-toggle.enabled { opacity: 1; pointer-events: all; border-color: var(--card-blue) !important; }
  .sub-toggle span { color: #888 !important; font-size: 0.85rem !important; }

  .start-btn {
    width: 100%;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 50px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Jeju Gothic', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(245,192,64,0.4);
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(245,192,64,0.5); }

  /* ── TOOL SCREEN ── */
  #tool-screen {
    display: none;
    width: 100%;
    max-width: min(900px, calc(100vw - 32px));
  }

  .tool-card {
    background: var(--bg);
    border-radius: 24px;
    padding: 18px 28px 18px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
  }

  .tool-title {
    font-family: 'Klee One', serif;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    font-weight: 600;
    text-align: center;
    color: var(--title-text);
    background: var(--title-bg);
    padding: 12px 32px;
    border-radius: 50px;
    margin: 6px 0 14px;
    letter-spacing: 0.12em;
  }

  /* MAP */
  .map-wrapper {
    width: 100%;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: transparent;
    margin-bottom: -16px;
  }

  .map-wrapper img {
    width: 100%;
    height: auto;
    display: block;
    mix-blend-mode: multiply;
    opacity: 0.75;
    border-radius: 12px;
    max-height: clamp(200px, 40vh, 360px);
    object-fit: contain;
  }

  /* 핀 SVG 레이어 — 이미지 위에 절대 배치 */
  #pin-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .map-pin { transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  .map-pin.active { transform: scale(1.5); }

  /* DIVIDER */
  .divider {
    height: 2px;
    background: var(--divider);
    margin: 0 -28px;
    opacity: 0.45;
  }

  /* SENTENCE ROW */
  .sentence-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.2vw, 12px);
    padding: 16px 0 14px;
    flex-wrap: wrap;
  }

  .s-card {
    border-radius: 14px;
    padding: 0 clamp(12px, 2vw, 22px);
    font-weight: 600;
    font-size: clamp(1.4rem, 3.5vw, 2.4rem);
    line-height: 1;
    min-width: clamp(56px, 8vw, 80px);
    height: clamp(56px, 9vw, 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .s-card.blue {
    background: var(--card-blue);
    color: var(--text-dark);
    font-family: 'Jeju Gothic', sans-serif;
  }

  .s-card.peach {
    background: var(--card-peach);
    color: var(--text-dark);
    font-family: 'Klee One', serif;
    font-size: clamp(1.5rem, 3.8vw, 2.6rem);
  }

  .s-card.ampm {
    font-size: clamp(1rem, 2.2vw, 1.6rem);
    padding: 0 clamp(10px, 1.5vw, 16px);
    font-family: 'Jeju Gothic', sans-serif;
  }

  .s-particle {
    font-family: 'Klee One', serif;
    font-size: clamp(1.3rem, 3vw, 2.2rem);
    font-weight: 600;
    color: var(--text-dark);
    letter-spacing: 0.05em;
  }

  .s-colon {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 8px;
  }
  .s-colon span {
    display: block;
    width: clamp(5px, 0.8vw, 8px);
    height: clamp(5px, 0.8vw, 8px);
    background: var(--text-dark);
    border-radius: 50%;
  }

  .s-desu {
    font-family: 'Klee One', serif;
    font-size: clamp(1.3rem, 3vw, 2.2rem);
    font-weight: 600;
    color: var(--text-dark);
  }

  /* FLIP ANIMATION */
  @keyframes flipIn {
    0%   { transform: rotateX(90deg) scale(0.85); opacity: 0; }
    100% { transform: rotateX(0deg)  scale(1);    opacity: 1; }
  }
  .flip { animation: flipIn 0.38s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  /* CLICK BUTTON */
  .click-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 50px;
    padding: 13px 36px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Jeju Gothic', sans-serif;
    margin: 0 auto;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(245,192,64,0.4);
  }
  .click-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(245,192,64,0.5); }
  .click-btn:active { transform: translateY(0); }

  .btn-icon {
    width: 26px; height: 26px;
    border: 2.5px solid var(--btn-text);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .credits {
    position: absolute;
    bottom: 10px; right: 18px;
    font-size: 0.72rem;
    color: #999;
    font-family: 'Jeju Gothic', sans-serif;
  }

  .back-btn {
    position: absolute;
    top: 14px; right: 14px;
    background: rgba(0,0,0,0.08);
    border: none;
    border-radius: 50px;
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    color: #555;
    font-family: 'Jeju Gothic', sans-serif;
  }
  .back-btn:hover { background: rgba(0,0,0,0.15); }

  .s-card.empty  { background: var(--card-blue);  color: transparent; }
  .s-card.empty-peach { background: var(--card-peach); color: transparent; }
</style>
</head>
<body>

<!-- ══════════════ SETUP SCREEN ══════════════ -->
<div id="setup-screen">
  <h1>いま　なんじですか。</h1>

  <div class="setup-section">
    <div class="setup-label">🌏 도시 목록</div>
    <div class="city-input-area" id="city-tags"></div>
    <div class="city-input-row">
      <input type="text" id="city-input" placeholder="도시 이름 입력 (예: 한국)" maxlength="10">
      <button onclick="addCity()">추가</button>
    </div>
  </div>

  <div class="setup-section">
    <div class="setup-label">⚙️ 출제 설정</div>

    <div class="toggle-row">
      <span>오전 / 오후 표시</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-ampm" checked>
        <div class="toggle-slider"></div>
      </label>
    </div>

    <div class="toggle-row">
      <span>불규칙 읽기 보장 (시)</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-irr-h" onchange="updateSubToggles()">
        <div class="toggle-slider"></div>
      </label>
    </div>
    <div class="toggle-row sub-toggle" id="sub-irr-h">
      <span>4시 · 7시 · 9시 중 반드시 포함</span>
      <span style="font-size:0.78rem;color:#bbb">자동 적용</span>
    </div>

    <div class="toggle-row">
      <span>불규칙 읽기 보장 (분)</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-irr-m" onchange="updateSubToggles()">
        <div class="toggle-slider"></div>
      </label>
    </div>
    <div class="toggle-row sub-toggle" id="sub-irr-m">
      <span>1·3·4·6·8·10분 중 반드시 포함</span>
      <span style="font-size:0.78rem;color:#bbb">자동 적용</span>
    </div>
  </div>

  <button class="start-btn" onclick="startTool()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5,3 19,12 5,21"/></svg>
    수행평가 시작
  </button>
</div>

<!-- ══════════════ TOOL SCREEN ══════════════ -->
<div id="tool-screen">
  <div class="tool-card">
    <button class="back-btn" onclick="goBack()">← 설정으로</button>
    <div class="tool-title">いま　なんじですか。</div>

    <!-- MAP: 이미지 + 핀 레이어 -->
    <div class="map-wrapper" id="map-wrapper">
      <img id="map-img"
        src="https://ryuu-spec.github.io/jpn-speaking-assessment/jpn-time-reading/wordmap.png"
        alt="world map">
      <svg id="pin-layer" viewBox="0 0 1024 536" xmlns="http://www.w3.org/2000/svg">
        <g id="pins-group"></g>
      </svg>
    </div>

    <div class="divider"></div>

    <!-- SENTENCE -->
    <div class="sentence-row">
      <div class="s-card blue empty" id="card-city">　　</div>
      <div class="s-particle">は　いま</div>
      <div class="s-card blue ampm empty" id="card-ampm">　</div>
      <div class="s-card peach empty-peach" id="card-h">　</div>
      <div class="s-colon"><span></span><span></span></div>
      <div class="s-card peach empty-peach" id="card-m">　　</div>
      <div class="s-desu">です。</div>
    </div>

    <button class="click-btn" onclick="nextQuestion()">
      <div class="btn-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1,4 1,10 7,10"/><path d="M3.51,15a9,9,0,1,0,.49-4.95"/></svg>
      </div>
      ▶　Click here
    </button>

    <div class="credits">Made by Soo Hyun Shin</div>
  </div>
</div>

<script>
// ── STATE ──
let cities = ['한국','일본','중국','미국','영국','프랑스'];
let showAmPm = true;
let irrHour  = false;
let irrMin   = false;
let currentCity = null;

// 핀 좌표 — viewBox 1024×536 기준
// 이미지(1024×536)에 맞춰 조정
const cityPins = {
  '한국':   { x: 808, y: 198 },
  '일본':   { x: 848, y: 190 },
  '중국':   { x: 748, y: 195 },
  '미국':   { x: 155, y: 215 },
  '영국':   { x: 418, y: 118 },
  '프랑스': { x: 438, y: 135 },
  '독일':   { x: 458, y: 118 },
  '러시아': { x: 640, y: 100 },
  '호주':   { x: 800, y: 390 },
  '캐나다': { x: 148, y: 140 },
  '브라질': { x: 238, y: 360 },
  '인도':   { x: 635, y: 255 },
  '이탈리아': { x: 468, y: 148 },
  '스페인': { x: 415, y: 148 },
};

const irrHours = [4, 7, 9];
const irrMins  = [1, 3, 4, 6, 8, 10];

// ── SETUP UI ──
function renderCityTags() {
  document.getElementById('city-tags').innerHTML = cities.map((c, i) => `
    <div class="city-tag">${c}<button onclick="removeCity(${i})">✕</button></div>
  `).join('');
}

function addCity() {
  const input = document.getElementById('city-input');
  const val = input.value.trim();
  if (val && !cities.includes(val)) { cities.push(val); renderCityTags(); }
  input.value = ''; input.focus();
}

function removeCity(i) { cities.splice(i, 1); renderCityTags(); }

document.getElementById('city-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addCity();
});

function updateSubToggles() {
  document.getElementById('sub-irr-h').classList.toggle('enabled', document.getElementById('toggle-irr-h').checked);
  document.getElementById('sub-irr-m').classList.toggle('enabled', document.getElementById('toggle-irr-m').checked);
}

function startTool() {
  if (cities.length === 0) { alert('도시를 한 개 이상 입력해주세요.'); return; }
  showAmPm = document.getElementById('toggle-ampm').checked;
  irrHour  = document.getElementById('toggle-irr-h').checked;
  irrMin   = document.getElementById('toggle-irr-m').checked;

  document.getElementById('card-ampm').style.display = showAmPm ? '' : 'none';
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('tool-screen').style.display  = 'block';

  buildPins();
  resetCards();
}

function goBack() {
  document.getElementById('tool-screen').style.display  = 'none';
  document.getElementById('setup-screen').style.display = 'block';
}

// ── PINS ──
function makePinEl(city, pos) {
  const NS = 'http://www.w3.org/2000/svg';
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('id', 'pin-' + city);
  g.setAttribute('class', 'map-pin');
  g.setAttribute('transform-origin', `${pos.x}px ${pos.y}px`);

  // shadow
  const sh = document.createElementNS(NS, 'ellipse');
  sh.setAttribute('cx', pos.x); sh.setAttribute('cy', pos.y + 18);
  sh.setAttribute('rx', '8');   sh.setAttribute('ry', '3');
  sh.setAttribute('fill', 'rgba(0,0,0,0.25)');

  // pointer triangle
  const tri = document.createElementNS(NS, 'polygon');
  tri.setAttribute('points', `${pos.x-6},${pos.y+8} ${pos.x+6},${pos.y+8} ${pos.x},${pos.y+19}`);
  tri.setAttribute('fill', 'var(--pin-default)');
  tri.setAttribute('class', 'pin-color');

  // circle body
  const circ = document.createElementNS(NS, 'circle');
  circ.setAttribute('cx', pos.x); circ.setAttribute('cy', pos.y);
  circ.setAttribute('r', '11');
  circ.setAttribute('fill', 'var(--pin-default)');
  circ.setAttribute('stroke', 'white'); circ.setAttribute('stroke-width', '2.5');
  circ.setAttribute('class', 'pin-color');

  // white dot
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('cx', pos.x); dot.setAttribute('cy', pos.y);
  dot.setAttribute('r', '4.5'); dot.setAttribute('fill', 'white');

  [sh, tri, circ, dot].forEach(el => g.appendChild(el));
  return g;
}

function buildPins() {
  const g = document.getElementById('pins-group');
  g.innerHTML = '';
  cities.forEach(city => {
    const pos = cityPins[city];
    if (pos) g.appendChild(makePinEl(city, pos));
  });
}

function highlightPin(city) {
  document.querySelectorAll('.map-pin').forEach(el => {
    el.classList.remove('active');
    el.querySelectorAll('.pin-color').forEach(c => c.setAttribute('fill', 'var(--pin-default)'));
  });
  const el = document.getElementById('pin-' + city);
  if (!el) return;
  el.classList.add('active');
  el.querySelectorAll('.pin-color').forEach(c => c.setAttribute('fill', 'var(--pin-active)'));
}

// ── RANDOM ──
function pickCity() {
  const pool = cities.filter(c => c !== currentCity);
  return (pool.length > 0 ? pool : cities)[Math.floor(Math.random() * (pool.length || cities.length))];
}

function pickHour() {
  if (irrHour && Math.random() < 0.55)
    return irrHours[Math.floor(Math.random() * irrHours.length)];
  return Math.floor(Math.random() * 12) + 1;
}

function pickMinute() {
  if (irrMin && Math.random() < 0.55)
    return irrMins[Math.floor(Math.random() * irrMins.length)];
  return Math.floor(Math.random() * 60);
}

function pad2(n) { return String(n).padStart(2, '0'); }

// ── QUESTION ──
function resetCards() {
  setCard('card-city', '　　', 's-card blue empty');
  setCard('card-ampm', '　',   's-card blue ampm empty');
  setCard('card-h',   '　',   's-card peach empty-peach');
  setCard('card-m',   '　　', 's-card peach empty-peach');
  if (!showAmPm) document.getElementById('card-ampm').style.display = 'none';
}

function setCard(id, text, cls) {
  const el = document.getElementById(id);
  el.className = cls;
  el.textContent = text;
}

function nextQuestion() {
  const city   = pickCity();
  currentCity  = city;
  const hour   = pickHour();
  const minute = pickMinute();
  const isAM   = Math.random() < 0.5;
  const ampm   = isAM ? '오전' : '오후';

  animateCard('card-city', city,          's-card blue',       0);
  if (showAmPm) animateCard('card-ampm',  ampm,               's-card blue ampm',  80);
  animateCard('card-h',    String(hour),  's-card peach',      160);
  animateCard('card-m',    pad2(minute),  's-card peach',      240);

  highlightPin(city);
}

function animateCard(id, text, cls, delay) {
  setTimeout(() => {
    const el = document.getElementById(id);
    el.style.display = '';
    el.className = cls + ' flip';
    el.textContent = text;
    el.addEventListener('animationend', () => { el.className = cls; }, { once: true });
  }, delay);
}
