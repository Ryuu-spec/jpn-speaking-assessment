<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jtime-tool</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Jeju+Gothic&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eaf3f9;
    --card-blue: #b8d4ee;
    --card-peach: #f5c9a8;
    --title-bg: #2d2d2d;
    --title-text: #ffffff;
    --btn-bg: #f5c040;
    --btn-text: #2d2d2d;
    --text-dark: #2d2d2d;
    --divider: #a0b8cc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jeju Gothic', sans-serif;
    background: #deedf5;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
  }

  /* ── SETUP SCREEN ── */
  #setup-screen {
    background: var(--bg);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  }

  #setup-screen h1 {
    font-family: 'Klee One', serif;
    font-size: 1.7rem;
    font-weight: 600;
    text-align: center;
    color: var(--title-text);
    background: var(--title-bg);
    padding: 14px 24px;
    border-radius: 50px;
    margin-bottom: 32px;
    letter-spacing: 0.08em;
  }

  .setup-section { margin-bottom: 24px; }

  .setup-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: #666;
    margin-bottom: 8px;
    letter-spacing: 0.06em;
  }

  .city-input-area {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: white;
    border-radius: 14px;
    padding: 12px;
    min-height: 56px;
    border: 2px solid var(--card-blue);
  }

  .city-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card-blue);
    color: var(--text-dark);
    font-size: 0.9rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 50px;
    font-family: 'Jeju Gothic', sans-serif;
  }

  .city-tag button {
    background: none;
    border: none;
    cursor: pointer;
    color: #666;
    font-size: 1rem;
    line-height: 1;
    padding: 0;
  }
  .city-tag button:hover { color: #e05a2b; }

  .city-input-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .city-input-row input {
    flex: 1;
    border: 2px solid var(--card-blue);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.95rem;
    font-family: 'Jeju Gothic', sans-serif;
    outline: none;
    background: white;
  }
  .city-input-row input:focus { border-color: var(--pin-default); }

  .city-input-row button {
    background: var(--pin-default);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Jeju Gothic', sans-serif;
    transition: background 0.2s;
  }
  .city-input-row button:hover { background: #3a6fa0; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border-radius: 14px;
    padding: 14px 18px;
    border: 2px solid var(--card-blue);
    margin-bottom: 10px;
  }
  .toggle-row span {
    font-size: 0.95rem;
    color: var(--text-dark);
    font-family: 'Jeju Gothic', sans-serif;
  }

  .toggle {
    position: relative;
    width: 48px;
    height: 26px;
    flex-shrink: 0;
  }
  .toggle input { display: none; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.3s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }
  .toggle input:checked + .toggle-slider { background: #4a8fc5; }
  .toggle input:checked + .toggle-slider::before { transform: translateX(22px); }

  .sub-toggle {
    margin-left: 20px;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.3s;
    border-color: #ddd !important;
  }
  .sub-toggle.enabled { opacity: 1; pointer-events: all; border-color: var(--card-blue) !important; }
  .sub-toggle span { color: #888 !important; font-size: 0.85rem !important; }

  .sub-sub-toggle {
    margin-left: 40px;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.3s;
    border-color: #ddd !important;
  }
  .sub-sub-toggle.enabled { opacity: 1; pointer-events: all; border-color: var(--card-blue) !important; }
  .sub-sub-toggle span { color: #888 !important; font-size: 0.85rem !important; }

  .start-btn {
    width: 100%;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 50px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Jeju Gothic', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(245,192,64,0.4);
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(245,192,64,0.5); }

  /* ── TOOL SCREEN ── */
  #tool-screen {
    display: none;
    width: 100%;
    max-width: min(1100px, calc(100vw - 24px));
  }

  .tool-card {
    background: var(--bg);
    border-radius: 24px;
    padding: 16px 28px 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
  }

  .tool-title {
    font-family: 'Klee One', serif;
    font-size: clamp(1.4rem, 3.5vw, 2rem);
    font-weight: 600;
    text-align: center;
    color: var(--title-text);
    background: var(--title-bg);
    padding: 13px 32px;
    border-radius: 50px;
    margin: 0 0 14px;
    letter-spacing: 0.12em;
  }

  /* MAP */
  .map-wrapper {
    width: 100%;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: transparent;
    margin-bottom: -8px;
  }

  .map-wrapper img {
    width: 100%;
    display: block;
    border-radius: 12px;
    height: clamp(200px, 40vh, 380px);
    object-fit: cover;
    object-position: center 25%;
  }

  /* DIVIDER */
  .divider {
    height: 2px;
    background: var(--divider);
    margin: 0 -28px;
    opacity: 0.45;
  }

  /* SENTENCE ROW */
  .sentence-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.5vw, 16px);
    padding: 24px 0 20px;
    flex-wrap: wrap;
  }

  .s-card {
    border-radius: 14px;
    padding: 0 clamp(14px, 2.5vw, 28px);
    font-weight: 600;
    font-size: clamp(1.6rem, 4vw, 2.8rem);
    line-height: 1;
    min-width: clamp(68px, 9vw, 110px);
    height: clamp(64px, 10vw, 100px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .s-card.blue {
    background: var(--card-blue);
    color: var(--text-dark);
    font-family: 'Jeju Gothic', sans-serif;
  }

  .s-card.peach {
    background: var(--card-peach);
    color: var(--text-dark);
    font-family: 'Klee One', serif;
    font-size: clamp(1.7rem, 4.2vw, 3rem);
  }

  .s-card.ampm {
    font-size: clamp(1.1rem, 2.5vw, 1.9rem);
    padding: 0 clamp(12px, 1.8vw, 20px);
    font-family: 'Jeju Gothic', sans-serif;
  }

  .s-particle {
    font-family: 'Klee One', serif;
    font-size: clamp(1.5rem, 3.5vw, 2.6rem);
    font-weight: 600;
    color: var(--text-dark);
    letter-spacing: 0.05em;
  }

  .s-colon {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding-top: 8px;
  }
  .s-colon span {
    display: block;
    width: clamp(6px, 1vw, 10px);
    height: clamp(6px, 1vw, 10px);
    background: var(--text-dark);
    border-radius: 50%;
  }

  .s-desu {
    font-family: 'Klee One', serif;
    font-size: clamp(1.5rem, 3.5vw, 2.6rem);
    font-weight: 600;
    color: var(--text-dark);
  }

  /* FLIP ANIMATION */
  @keyframes flipIn {
    0%   { transform: rotateX(90deg) scale(0.85); opacity: 0; }
    100% { transform: rotateX(0deg)  scale(1);    opacity: 1; }
  }
  .flip { animation: flipIn 0.38s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  /* CLICK BUTTON */
  .click-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 50px;
    padding: 15px 44px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Jeju Gothic', sans-serif;
    margin: 4px auto 0;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(245,192,64,0.4);
  }
  .click-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(245,192,64,0.5); }
  .click-btn:active { transform: translateY(0); }

  .btn-icon {
    width: 28px; height: 28px;
    border: 2.5px solid var(--btn-text);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .credits {
    position: absolute;
    bottom: 10px; right: 18px;
    font-size: 0.72rem;
    color: #999;
    font-family: 'Jeju Gothic', sans-serif;
  }

  .back-btn {
    display: inline-block;
    background: rgba(255,255,255,0.85);
    border: none;
    border-radius: 50px;
    padding: 7px 16px;
    font-size: 0.8rem;
    cursor: pointer;
    color: #555;
    font-family: 'Jeju Gothic', sans-serif;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 10px;
  }
  .back-btn:hover { background: rgba(255,255,255,1); }

  .s-card.empty  { background: var(--card-blue);  color: transparent; }
  .s-card.empty-peach { background: var(--card-peach); color: transparent; }

  .time-mode-group {
    display: flex;
    background: white;
    border-radius: 50px;
    border: 2px solid var(--card-blue);
    padding: 4px;
    gap: 4px;
    width: 100%;
  }
  .time-mode-group input[type="radio"] { display: none; }
  .time-mode-group label {
    flex: 1;
    text-align: center;
    padding: 8px 10px;
    border-radius: 50px;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: 'Jeju Gothic', sans-serif;
    color: #888;
    transition: background 0.2s, color 0.2s;
  }
  .time-mode-group input[type="radio"]:checked + label {
    background: #4a8fc5;
    color: white;
    font-weight: 700;
  }
</style>
</head>
<body>

<!-- ══════════════ SETUP SCREEN ══════════════ -->
<div id="setup-screen">
  <h1>いま　なんじですか。</h1>

  <div class="setup-section">
    <div class="setup-label">🌏 도시 목록</div>
    <div class="city-input-area" id="city-tags"></div>
    <div class="city-input-row">
      <input type="text" id="city-input" placeholder="도시 이름 입력 (예: 한국)" maxlength="10">
      <button onclick="addCity()">추가</button>
    </div>
  </div>

  <div class="setup-section">
    <div class="setup-label">⚙️ 출제 설정</div>

    <div class="toggle-row" style="flex-direction: column; align-items: flex-start; gap: 10px;">
      <span>시간 형식</span>
      <div class="time-mode-group">
        <input type="radio" name="time-mode" id="mode-ampm" value="ampm" checked>
        <label for="mode-ampm">오전/오후</label>
        <input type="radio" name="time-mode" id="mode-none" value="none">
        <label for="mode-none">없음</label>
        <input type="radio" name="time-mode" id="mode-24h" value="24h">
        <label for="mode-24h">24시간제</label>
      </div>
    </div>

    <div class="toggle-row">
      <span>불규칙 읽기 보장 (시)</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-irr-h" onchange="updateSubToggles()">
        <div class="toggle-slider"></div>
      </label>
    </div>
    <div class="toggle-row sub-toggle" id="sub-irr-h">
      <span>4시 · 7시 · 9시 중 반드시 포함</span>
      <span style="font-size:0.78rem;color:#bbb">자동 적용</span>
    </div>

    <div class="toggle-row">
      <span>분 포함</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-include-min" checked onchange="updateSubToggles()">
        <div class="toggle-slider"></div>
      </label>
    </div>

    <div class="toggle-row sub-toggle" id="sub-min-unit" style="flex-direction: column; align-items: flex-start; gap: 10px;">
      <span>분 단위</span>
      <div class="time-mode-group" style="width: 100%;">
        <input type="radio" name="min-unit" id="min-10" value="10" onchange="updateSubToggles()">
        <label for="min-10">10분 단위</label>
        <input type="radio" name="min-unit" id="min-5" value="5" onchange="updateSubToggles()">
        <label for="min-5">5분 단위</label>
        <input type="radio" name="min-unit" id="min-1" value="1" checked onchange="updateSubToggles()">
        <label for="min-1">1분 단위</label>
      </div>
    </div>

    <div class="toggle-row sub-toggle" id="row-irr-m">
      <span>불규칙 읽기 보장 (분)</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-irr-m" onchange="updateSubToggles()">
        <div class="toggle-slider"></div>
      </label>
    </div>
    <div class="toggle-row sub-sub-toggle" id="sub-irr-m">
      <span>1·3·4·6·8·10분 중 반드시 포함</span>
      <span style="font-size:0.78rem;color:#bbb">자동 적용</span>
    </div>
  </div>

  <button class="start-btn" onclick="startTool()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5,3 19,12 5,21"/></svg>
    수행평가 시작
  </button>
</div>

<!-- ══════════════ TOOL SCREEN ══════════════ -->
<div id="tool-screen">
  <div class="tool-card">
    <button class="back-btn" onclick="goBack()">← 설정으로</button>
    <div class="tool-title">いま　なんじですか。</div>

    <!-- MAP -->
    <div class="map-wrapper">
      <img src="./worldmap2.jpg" alt="world map">
    </div>

    <div class="divider"></div>

    <!-- SENTENCE -->
    <div class="sentence-row">
      <div class="s-card blue empty" id="card-city">　　</div>
      <div class="s-particle">は　いま</div>
      <div class="s-card blue ampm empty" id="card-ampm">　</div>
      <div class="s-card peach empty-peach" id="card-h">　</div>
      <div class="s-colon" id="card-colon"><span></span><span></span></div>
      <div class="s-card peach empty-peach" id="card-m">　　</div>
      <div class="s-desu">です。</div>
    </div>

    <button class="click-btn" onclick="nextQuestion()">
      <div class="btn-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1,4 1,10 7,10"/><path d="M3.51,15a9,9,0,1,0,.49-4.95"/></svg>
      </div>
      ▶　Click here
    </button>

    <div class="credits">Made by Soo Hyun Shin</div>
  </div>
</div>

<script>
// ── STATE ──
let cities = ['한국','일본','중국','미국','영국','프랑스'];
let timeMode = 'ampm'; // 'ampm' | 'none' | '24h'
let irrHour   = false;
let irrMin    = false;
let includeMin = true;
let minUnit   = '1'; // '10' | '5' | '1'
let currentCity = null;

const irrHours = [4, 7, 9];
const irrMins  = [1, 3, 4, 6, 8, 10];

// ── SETUP UI ──
function renderCityTags() {
  document.getElementById('city-tags').innerHTML = cities.map((c, i) => `
    <div class="city-tag">${c}<button onclick="removeCity(${i})">✕</button></div>
  `).join('');
}

function addCity() {
  const input = document.getElementById('city-input');
  const val = input.value.trim();
  if (val && !cities.includes(val)) { cities.push(val); renderCityTags(); }
  input.value = ''; input.focus();
}

function removeCity(i) { cities.splice(i, 1); renderCityTags(); }

document.getElementById('city-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addCity();
});

function updateSubToggles() {
  const irrHOn      = document.getElementById('toggle-irr-h').checked;
  const includeMinOn = document.getElementById('toggle-include-min').checked;
  const minUnitVal  = document.querySelector('input[name="min-unit"]:checked')?.value || '1';
  const is1Min      = minUnitVal === '1';
  const irrMOn      = document.getElementById('toggle-irr-m').checked;

  document.getElementById('sub-irr-h').classList.toggle('enabled', irrHOn);
  document.getElementById('sub-min-unit').classList.toggle('enabled', includeMinOn);
  document.getElementById('row-irr-m').classList.toggle('enabled', includeMinOn && is1Min);
  document.getElementById('sub-irr-m').classList.toggle('enabled', includeMinOn && is1Min && irrMOn);
}

function startTool() {
  if (cities.length === 0) { alert('도시를 한 개 이상 입력해주세요.'); return; }
  timeMode   = document.querySelector('input[name="time-mode"]:checked').value;
  irrHour    = document.getElementById('toggle-irr-h').checked;
  irrMin     = document.getElementById('toggle-irr-m').checked;
  includeMin = document.getElementById('toggle-include-min').checked;
  minUnit    = document.querySelector('input[name="min-unit"]:checked').value;

  document.getElementById('card-ampm').style.display  = timeMode === 'ampm' ? '' : 'none';
  document.getElementById('card-colon').style.display = includeMin ? '' : 'none';
  document.getElementById('card-m').style.display     = includeMin ? '' : 'none';
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('tool-screen').style.display  = 'block';

  resetCards();
}

function goBack() {
  document.getElementById('tool-screen').style.display  = 'none';
  document.getElementById('setup-screen').style.display = 'block';
}

// ── RANDOM ──
function pickCity() {
  const pool = cities.filter(c => c !== currentCity);
  return (pool.length > 0 ? pool : cities)[Math.floor(Math.random() * (pool.length || cities.length))];
}

function pickHour() {
  if (timeMode === '24h') {
    if (irrHour && Math.random() < 0.55) {
      const irr24 = [4, 7, 9, 14, 17, 19];
      return irr24[Math.floor(Math.random() * irr24.length)];
    }
    return Math.floor(Math.random() * 24);
  }
  if (irrHour && Math.random() < 0.55)
    return irrHours[Math.floor(Math.random() * irrHours.length)];
  return Math.floor(Math.random() * 12) + 1;
}

function pickMinute() {
  if (minUnit === '10') return [0, 10, 20, 30, 40, 50][Math.floor(Math.random() * 6)];
  if (minUnit === '5')  return Math.floor(Math.random() * 12) * 5;
  if (irrMin && Math.random() < 0.55)
    return irrMins[Math.floor(Math.random() * irrMins.length)];
  return Math.floor(Math.random() * 60);
}

function pad2(n) { return String(n).padStart(2, '0'); }

// ── QUESTION ──
function resetCards() {
  setCard('card-city', '　　', 's-card blue empty');
  setCard('card-ampm', '　',   's-card blue ampm empty');
  setCard('card-h',   '　',   's-card peach empty-peach');
  setCard('card-m',   '　　', 's-card peach empty-peach');
  document.getElementById('card-ampm').style.display  = timeMode === 'ampm' ? '' : 'none';
  document.getElementById('card-colon').style.display = includeMin ? '' : 'none';
  document.getElementById('card-m').style.display     = includeMin ? '' : 'none';
}

function setCard(id, text, cls) {
  const el = document.getElementById(id);
  el.className = cls;
  el.textContent = text;
}

function nextQuestion() {
  const city   = pickCity();
  currentCity  = city;
  const hour   = pickHour();
  const minute = includeMin ? pickMinute() : 0;
  const isAM   = Math.random() < 0.5;
  animateCard('card-city', city, 's-card blue', 0);
  if (timeMode === 'ampm') animateCard('card-ampm', isAM ? '오전' : '오후', 's-card blue ampm', 80);
  animateCard('card-h', String(hour), 's-card peach', 160);
  if (includeMin) animateCard('card-m', pad2(minute), 's-card peach', 240);
}

function animateCard(id, text, cls, delay) {
  setTimeout(() => {
    const el = document.getElementById(id);
    el.style.display = '';
    el.className = cls + ' flip';
    el.textContent = text;
    el.addEventListener('animationend', () => { el.className = cls; }, { once: true });
  }, delay);
}

// ── INIT ──
renderCityTags();
updateSubToggles();
</script>
</body>
</html>
